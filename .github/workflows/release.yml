name: Release

# Pushing a tag such as v0.2.0 builds every platform and attaches the packages
# to a draft GitHub Release. Review the draft, then publish it by hand.
# Running it by hand from the Actions tab builds without a release and keeps
# the packages as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImages only run on systems with a glibc at least as new as the
          # build machine's, so Linux packages are built on the oldest supported Ubuntu.
          - platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Textgate ${{ github.ref_name }}
          releaseBody: Mac builds are ad-hoc signed but not notarized; Windows installers are unsigned. See the README for install notes.
          releaseDraft: true
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(target/*/release/bundle/macos/Textgate.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected one macOS app bundle, found ${#apps[@]}" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign --display --verbose=4 "${apps[0]}"
