[package]
name = "textgate"
version = "0.1.7"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
comrak = { version = "0.59.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2"
tempfile = "3.27"
trash = "5.2.9"

[target.'cfg(unix)'.dependencies]
# Already in the build through Tauri; used for renames that never replace.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the build through Tauri; used directly to enable spell checking.
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the build through Tauri; used directly to enable spell checking.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSObject", "NSString", "NSUserDefaults", "NSValue"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }
